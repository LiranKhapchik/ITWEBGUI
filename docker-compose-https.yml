version: '3.8'

services:
  military-portal-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: military-portal-app
    volumes:
      - ./data:/opt/app-root/src/data
    restart: always

  https-proxy:
    image: nginx:alpine
    container_name: military-portal-https
    ports:
      - "8001:8001"
    volumes:
      - ./docker/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - military-portal-app
    restart: always
